<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAPODI</title>
</head>
<body style="margin:0;overflow:hidden">
<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbzO2ON14ucGrrZWcPwJifbjuYToxtIlJ5Twi92EVctAv7pLIBvMZ6qwEjDe2QhXFEE/exec"
  style="width:100vw;height:100vh;border:none;display:block"
  sandbox="allow-scripts allow-forms allow-same-origin allow-downloads allow-popups allow-modals allow-popups-to-escape-sandbox"
  allowfullscreen>
</iframe>

<script>
  const frame = document.getElementById('app');
  const url = frame.src;

  // Saat koneksi kembali online → reload iframe
  window.addEventListener('online', () => {
    frame.src = url;
  });

  // Saat koneksi terputus → tampilkan pesan di dalam iframe
  window.addEventListener('offline', () => {
    frame.src = 'about:blank';
    setTimeout(() => {
      frame.contentDocument?.write(
        '<body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0e17;color:#8892a8;font-family:sans-serif">📡 Tidak ada koneksi internet…</body>'
      );
    }, 50);
  });
</script>
</body>
</html>
